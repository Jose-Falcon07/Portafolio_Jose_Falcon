<section class="hero" id="inicio">

  <video
    #heroVideo
    class="hero__background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    (loadeddata)="playVideo()"
    (canplay)="playVideo()"
  >
    <source
      src="videos/1992-153555258.mp4"
      type="video/mp4"
    >
  </video>

  <!-- CAPA OSCURA SOBRE EL VIDEO -->
  <div class="hero__overlay"></div>

  <!-- EFECTOS DE LUZ -->
  <div class="hero__glow hero__glow--one"></div>
  <div class="hero__glow hero__glow--two"></div>

  <!-- CONTENIDO -->
  <div class="container hero__container">

    <div class="hero__content">

      <p class="hero__eyebrow" i18n>
        Hola, soy
      </p>

      <h1>
        Jose
        <span>Falcon</span>
      </h1>

      <h2 i18n>
        Desarrollador de Software Jr.
      </h2>

      <p class="hero__description" i18n>
        Creo aplicaciones modernas, funcionales y escalables,
        combinando desarrollo frontend, backend, bases de datos
        y tecnologías cloud.
      </p>

      <div class="hero__actions">

        <a
          href="#proyectos"
          class="button button--primary"
          i18n
        >
          Ver proyectos
        </a>

        <a
          href="cv/Jose-Falcon-CV.pdf"
          class="button button--secondary"
          target="_blank"
          rel="noopener noreferrer"
          i18n
        >
          Descargar CV
        </a>

      </div>

      <div class="hero__technologies">

        <span>Angular</span>
        <span>Java</span>
        <span>Python</span>
        <span>Firebase</span>

      </div>

    </div>

  </div>

</section>
